[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "padic-grn-viz"
version = "0.1.0"
description = "Visualizacion y reportes reproducibles para analisis p-adicos discretos."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Jesús Rogelio Pérez-Buendía", email = "rogelio.perez@cimat.mx"},
  {name = "Víctor Nopal-Coello", email = "victor_nopal@uaeh.edu.mx"},
  {name = "Yuriria Cortés-Poza", email = "yuriria.cortes@iimas.unam.mx"}
]
dependencies = ["matplotlib>=3.8"]

[project.scripts]
pgviz-dependency-graph = "padic_grn_viz.cli:main_dependency_graph"
pgviz-hierarchical-graph = "padic_grn_viz.cli:main_hierarchical_graph"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
